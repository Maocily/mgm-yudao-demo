name: build-windows

# 手动触发，或推 main 时自动跑
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kiosk-terminal/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    name: Build Windows .exe
    runs-on: windows-latest
    # 不用 defaults.working-directory，所有路径显式相对 GITHUB_WORKSPACE (repo 根)
    # 避免 setup-node 的 cache-dependency-path 与 working-directory 互相干扰

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # 相对 GITHUB_WORKSPACE (repo 根) —— 锁文件在 kiosk-terminal/ 下
          cache-dependency-path: kiosk-terminal/package-lock.json

      - name: Install dependencies
        working-directory: kiosk-terminal
        run: npm ci

      - name: Type check & build renderer + electron
        working-directory: kiosk-terminal
        run: npm run build

      - name: Package Windows installer (NSIS) + portable
        working-directory: kiosk-terminal
        run: npx electron-builder --win --x64 --publish never

      - name: Upload installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-setup
          path: kiosk-terminal/release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable (win-unpacked)
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-portable
          path: kiosk-terminal/release/win-unpacked
          if-no-files-found: error
          retention-days: 14
